name: Backend Tests

on:
  pull_request:
    branches: [test, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  push:
    branches: [test, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"

# Least privilege for the GITHUB_TOKEN
permissions:
  contents: read

# One run at a time against the shared test DB
concurrency:
  group: backend-tests-db
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Run tests
        if: github.event_name != 'pull_request'
        env:
          NODE_ENV: test
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          JWT_EXPIRES_IN: 1d
          JWT_REFRESH_TOKEN: ${{ secrets.TEST_JWT_REFRESH_TOKEN }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.TEST_CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.TEST_CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.TEST_CLOUDINARY_API_SECRET }}
          CORS_ORIGIN: http://localhost:5173
        run: npm test

      - name: Upload coverage
        if: github.event_name != 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage
          if-no-files-found: ignore